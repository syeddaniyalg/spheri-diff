steps: 25000
batch_size: 16
learning_rate: 0.0003
min_learning_rate: 0.000001
warmup_fraction: 0.05
weight_decay: 0.0
gradient_clip: 0.8
ema_decay: 0.999
precision: fp16
evaluate_every: 1250
checkpoint_every: 1250
train_split: train
milestones: [0.25, 0.5, 0.75]
source_levels: [50, 100, 150, 200, 250, 300, 400, 500, 600, 700, 850, 925, 1000]

evaluation:
  windows: 32
  members: 3
  ddim_steps: 15
  batch_size: 16
  levels: [0.1, 0.3, 0.5, 0.7, 0.9]
  fields:
    - 500_geopotential
    - 850_temperature
    - 2m_temperature
    - 10m_u_component_of_wind
    - mean_sea_level_pressure
    - 700_specific_humidity
